<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 화면으로 이동</title>
  <!-- 예전 관리자 주소(/admin/)를 즐겨찾기 해 둔 경우를 위해 새 주소(/admin.html)로 옮긴다. ?edit= 값은 그대로 넘긴다 -->
  <script>location.replace('/admin.html' + location.search);</script>
  <meta http-equiv="refresh" content="0; url=/admin.html">
</head>
<body>
  <p><a href="/admin.html">관리자 화면으로 이동</a></p>
</body>
</html>
